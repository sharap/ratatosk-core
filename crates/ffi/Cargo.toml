[package]
name = "ratatosk-ffi"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "UniFFI-граница ядра: Android и десктоп (§13.3)"

# Cargo подбирает `src/bin/*.rs` сам, и генератор биндингов, однажды сюда
# попавший, попадёт снова. У этого крейта исполняемых целей нет ни одной
# и быть не должно — см. пояснение к зависимостям ниже.
autobins = false

[lib]
# cdylib — для Android (.so внутри .aar); staticlib — для сборок, где ядро
# линкуется статически; rlib — чтобы десктоп мог звать ядро напрямую,
# без FFI-накладных расходов (§13.3).
crate-type = ["cdylib", "staticlib", "rlib"]
name = "ratatosk_ffi"

[dependencies]
ratatosk-codec.workspace = true
ratatosk-core.workspace = true
ratatosk-crypto.workspace = true
ratatosk-proto.workspace = true
ratatosk-store.workspace = true
ratatosk-transport.workspace = true

# Ядро живёт на собственном потоке с рантаймом: методы через UniFFI
# синхронные, а драйвер асинхронный, и мост между ними — здесь.
tokio = { workspace = true }
uniffi.workspace = true
thiserror.workspace = true

# Журнал. Сам крейт почти не пишет — пишут ядро и транспорт, — но
# **подписчика ставить некому, кроме него**: на десктопе это делает лаба,
# а на телефоне до сих пор не делал никто, и `tracing` без подписчика
# молчит по построению. Разбор шестой ступени с телефона поэтому шёл
# вслепую: в `logcat` не было ни одной нашей строки.
tracing.workspace = true

# Подписчик нужен **на всех платформах**, и это правка.
#
# Прежде он заводился только под Android, а на десктопе полагались
# на стенд: тот ставит свой. Но стенд — не единственный десктопный
# клиент: компаньон на Compose (`DESKTOP.md`) грузит эту библиотеку
# через JNA и своего подписчика не имеет ниоткуда. Для него `tracing`
# молчал по построению — ровно та же слепота, что была на телефоне
# до 0.4.
#
# Второй подписчик там, где уже есть свой, ничего не ломает: ставится
# он через `try_init`, и у стенда остаётся его собственный.
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Тонкая обёртка над платформенным `liblog` — только под Android:
# на десктопе `logcat`-а нет, и писать в него нечего.
[target.'cfg(target_os = "android")'.dependencies]
# Тонкая обёртка над платформенным `liblog`. Своего C в ней нет: это
# объявления к тому, что на Android уже влинковано в процесс.
tracing-android = "0.2"

# build.rs здесь нет сознательно: `uniffi::setup_scaffolding!()` — это
# proc-macro режим, скаффолдинг генерируется макросом. Сборочный скрипт
# с `generate_scaffolding_for_crate` относится к UDL-режиму, и одновременно
# они не работают.
#
# Генератора биндингов здесь тоже нет: он требует признака `uniffi/cli`,
# а признаки включаются на крейт целиком, не на цель. Держи мы его тут,
# clap и camino попали бы в граф зависимостей библиотеки, то есть в `.so`
# для Android. Инструмент вынесен в `crates/bindgen`.

[features]
# Живой Tor. **Не по умолчанию**: транспорт написан по документации arti
# и проверяется отдельной сборкой; пока он не включён, onion честно
# отказывает, а §5.4 переходит к следующей ступени.
tor = ["ratatosk-transport/onion-arti"]
# Живая почта (§5.3): TLS, поход за ящиком. **Не по умолчанию**, как и `tor`:
# пока чужой API не сошёлся сборкой, остальное дерево обязано быть зелёным.
mail = ["ratatosk-transport/chatmail-net"]
# Ступень поверх реле nostr (0.3). **Не по умолчанию**, как `tor` и `mail`.
#
# Признак `tor` она не требует, и это не недосмотр: до локального реле
# Tor не нужен по построению, а наружу путь без него честно откажет —
# ровно как у почты. Настройка ступени при этом живёт и без признака:
# она ложится на диск и ждёт сборки, в которой ей найдётся раннер.
nostr = ["ratatosk-transport/nostr"]
# Встроенный узел меша (0.2). **Не по умолчанию**: зависимость идёт из git
# и тянет ironwood с yggdrasil целиком. Без признака режим «свой узел»
# остаётся в настройках и честно отказывает.
ygg-node = ["ratatosk-transport/ygg-node"]
# Своё радио эфира (0.4). **Не по умолчанию**, как и остальные живые
# ступени, но с собственной оговоркой: работает оно только на Linux,
# потому что `bluer` — обвязка BlueZ.
#
# **Включать признак при этом можно где угодно.** Вне Linux он не подтянет
# ничего и не изменит ничего: ступень соберётся мостом, эфира не будет,
# сборка пройдёт. Сделано это ради десктопного компаньона — он собирается
# на трёх платформах, и разные команды сборки на них означали бы, что
# однажды соберут не тем набором и будут искать, почему.
bt = ["ratatosk-transport/bt"]

[lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"
