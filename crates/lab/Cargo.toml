[package]
name = "ratatosk-lab"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Стенд для проверки работы на живой сети: два узла, LAN, текст 1:1"

# Стенд, а не продукт. Он существует ровно затем, чтобы проверять
# работоспособность до появления UI, и не должен обрастать ничем сверх этого:
# всё, что окажется здесь и понадобится клиенту, должно жить в ядре (§13.3).

[[bin]]
name = "ratatosk-lab"
path = "src/main.rs"

[dependencies]
ratatosk-codec.workspace = true
ratatosk-core.workspace = true
ratatosk-crypto.workspace = true
ratatosk-proto.workspace = true
ratatosk-store.workspace = true
ratatosk-transport.workspace = true

data-encoding.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[features]
# Живой Tor. **Не по умолчанию**: транспорт написан по документации arti
# и проверяется отдельной сборкой; пока он не включён, onion честно
# отказывает, а §5.4 переходит к следующей ступени.
tor = ["ratatosk-transport/onion-arti"]
# Живая почта (§5.3): TLS, поход за ящиком. **Не по умолчанию**, как и `tor`:
# пока чужой API не сошёлся сборкой, остальное дерево обязано быть зелёным.
mail = ["ratatosk-transport/chatmail-net"]
# Ступень поверх реле nostr (0.3). **Не по умолчанию**, как `tor` и `mail`.
#
# Признак `tor` она не требует, и это не недосмотр: до локального реле
# (`ws://127.0.0.1:8080`) Tor не нужен по построению — цепочка встречи
# до петлевого адреса никуда не ведёт. Так ступень и проверяется первой:
# без Tor, без сертификата, на своём же `nostr-rs-relay`.
#
# Для реле в интернете признак `tor` нужен, иначе путь честно откажет —
# ровно как у почты.
nostr = ["ratatosk-transport/nostr"]
# Встроенный узел меша (0.2). **Не по умолчанию**: зависимость идёт из git
# и тянет ironwood с yggdrasil целиком. Без признака режим «свой узел»
# остаётся в настройках и честно отказывает.
ygg-node = ["ratatosk-transport/ygg-node"]

[lints.rust]
unsafe_code = "forbid"
