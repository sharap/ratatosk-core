[package]
name = "ratatosk-store"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Локальное хранилище: SQLite, FTS5, compaction (§12)"

[dependencies]
ratatosk-crdt.workspace = true
ratatosk-codec.workspace = true
# §8.1: комбинирование примитивов живёт в одном модуле. Хранилище решает,
# что шифровать, но не как, — иначе рядом с криптостеком завёлся бы второй,
# спрятанный внутри слоя БД.
ratatosk-crypto.workspace = true

rusqlite.workspace = true
zeroize.workspace = true
thiserror.workspace = true

[lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"
