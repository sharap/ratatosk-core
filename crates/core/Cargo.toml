[package]
name = "ratatosk-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Ядро Ratatosk: sans-io Engine и драйвер (§13.3)"

[dependencies]
ratatosk-wire.workspace = true
ratatosk-crdt.workspace = true
ratatosk-crypto.workspace = true
ratatosk-codec.workspace = true
ratatosk-proto.workspace = true
ratatosk-store.workspace = true

rand_core.workspace = true
zeroize.workspace = true
thiserror.workspace = true
tracing.workspace = true

# Драйвер — единственная часть ядра, знающая про рантайм. Он за фичей,
# чтобы симуляция (§16) собиралась без tokio вообще.
tokio = { workspace = true, optional = true }
ratatosk-transport = { workspace = true, optional = true }

[dev-dependencies]
ratatosk-sim.workspace = true
# `test-util` — виртуальные часы tokio, и нужен он только тестам драйвера.
#
# Драйвер спит по-настоящему (`tokio::time::sleep` в его `select!`), и тест,
# ждущий уступками планировщику, времени не двигает вовсе: сколько драйвер
# успеет за фиксированное число уступок, зависит от машины. С виртуальными
# часами вопрос снимается — часы двигаются, когда рантайму больше нечего
# делать, и прогон перестаёт зависеть от того, чья машина быстрее.
#
# В сборку не попадает: `dev-dependencies` живут только в тестах.
tokio = { workspace = true, features = ["test-util"] }

[features]
default = ["driver"]
driver = ["dep:tokio", "dep:ratatosk-transport"]

[lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"
