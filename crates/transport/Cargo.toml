[package]
name = "ratatosk-transport"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Ввод-вывод транспортов: LAN, arti/onion, chatmail (§5)"

# Единственный крейт в дереве, которому разрешено владеть сокетами и рантаймом.
# Всё, что выше по стеку, остаётся sans-io — иначе §16 недостижим.
[dependencies]
ratatosk-proto.workspace = true
ratatosk-wire.workspace = true
# Маяк LAN (§5.1) ротируется и выводится из `IK`, поэтому сопоставлять его
# обязан тот, кто слушает эфир, — то есть транспорт. Иначе ядру пришлось бы
# выдавать вниз новые ожидаемые значения каждые 15 минут.
ratatosk-crypto.workspace = true

tokio.workspace = true
tokio-util.workspace = true
data-encoding.workspace = true
# Имя экземпляра mDNS — случайное и своё у каждого запуска (§5.1).
rand_core.workspace = true
thiserror.workspace = true
tracing.workspace = true

# Транспортные зависимости выделены в фичи: симуляция и юнит-тесты собираются
# без arti, а сборка ядра под CI не тянет полстека Tor ради проверки логики.
arti-client = { workspace = true, optional = true }
tor-rtcompat = { workspace = true, optional = true }
# Прямо, а не через переэкспорты arti-client: путь до `HsNickname`,
# `KeystoreId` и `Connected` не должен зависеть от того, что именно
# arti решил переэкспортировать в этой версии.
tor-hsservice = { workspace = true, optional = true }
tor-keymgr = { workspace = true, optional = true }
tor-cell = { workspace = true, optional = true }
# Разобранный запрос входящего потока (`IncomingStreamRequest`) живёт здесь,
# а не в `tor-cell`: это уже не сырая ячейка.
tor-proto = { workspace = true, optional = true }
futures = { workspace = true, optional = true }
# Выбор криптопровайдера rustls — см. пояснение в общем манифесте.
rustls = { workspace = true, optional = true }
tokio-rustls = { workspace = true, optional = true }
webpki-roots = { workspace = true, optional = true }
async-imap = { workspace = true, optional = true }
async-smtp = { workspace = true, optional = true }
mdns-sd = { workspace = true, optional = true }
# Шестая ступень (0.4): объявление BLE и сокеты L2CAP. Только Linux —
# это обвязка BlueZ, — и потому под признаком, не в умолчании.
bluer = { workspace = true, optional = true }
tokio-tungstenite = { workspace = true, optional = true }
ygg_stream = { workspace = true, optional = true }
# Только ради `get_peers_json`: состав пиров библиотека отдаёт строкой.
serde_json = { workspace = true, optional = true }

[features]
default = ["onion", "chatmail", "lan"]
onion = ["dep:arti-client", "dep:tor-rtcompat"]
# Живая интеграция с arti. **Не в `default` намеренно**: API arti 0.x
# проверяется только сборкой, и пока он не сошёлся, остальное дерево
# обязано оставаться зелёным. Переедет в `default`, когда
# `cargo check -p ratatosk-transport --features onion-arti` пройдёт чисто.
onion-arti = [
    "onion",
    # Без этого признака arti собирается **без поддержки ctor-хранилищ**
    # и отвергает конфиг словами `NoCompileTimeSupport`. Он объявлен здесь,
    # а не в общем списке признаков arti-client, чтобы сборка без живого
    # Tor не тащила лишний код.
    "arti-client/ctor-keystore",
    "dep:tor-hsservice",
    "dep:tor-keymgr",
    "dep:tor-cell",
    "dep:tor-proto",
    "dep:futures",
    "dep:rustls",
]
chatmail = ["dep:async-imap", "dep:async-smtp"]
# Живые сокеты почты. **Не в `default`**, по той же причине, что и
# `onion-arti`: пока чужой API не сошёлся сборкой, остальное дерево обязано
# оставаться зелёным.
#
# `tokio-socks` здесь не нужен и убран: через Tor мы ходим потоком arti
# напрямую, а не через SOCKS-прокси, которого у библиотечного arti и нет.
#
# `tokio-util` здесь не перечислен намеренно: он не необязательная
# зависимость, а обычная (полосы LAN разбираются его кодеком), и `dep:`
# на неё — ошибка манифеста, а не лишняя строка. Нужный признак `compat`
# объявлен в общем манифесте.
chatmail-net = [
    "chatmail",
    "dep:rustls",
    "dep:tokio-rustls",
    "dep:webpki-roots",
    # Приём читает ответы IMAP потоками futures: `async-imap` отдаёт
    # выборку, отметки и уборку именно ими, а не итераторами.
    "dep:futures",
]
lan = ["dep:mdns-sd"]
# Живой эфир Bluetooth (0.4). **Не в `default`**, и причин две.
#
# Первая та же, что у `onion-arti`, `chatmail-net` и `nostr`: чужой API
# проверяется сборкой, и пока он не сошёлся, остальное дерево обязано
# оставаться зелёным.
#
# Вторая своя: `bluer` — обвязка BlueZ, то есть **только Linux**. Android
# сюда не входит и войти не может: там объявление и сокет — это Java
# (0.4.6), и радио оттуда приходит мостом (`bluetooth::bridge`), который
# собирается **без** этого признака. Включать его в сборке под телефон
# нельзя — она не соберётся, и это честнее, чем ступень, которой там нет.
#
# Без признака раннер остаётся и остаётся полным: мост собирается всегда,
# а вот радио ему никто не вручает, и ступень честно объявляется
# потерянной. Ровно то, что видно в `/who` строкой `bt: работает=нет`.
bt = [
    # Обзор `bluer` отдаёт потоком futures, а не tokio.
    "dep:futures",
    "dep:bluer",
]
# Ступень поверх реле nostr (0.3). **Не в `default`**, и по той же причине,
# что `onion-arti` и `chatmail-net`: пока чужой API не сошёлся сборкой,
# остальное дерево обязано оставаться зелёным.
#
# Признак тянет ровно то, что нужно: веб-сокет, разбор ответа реле и тот же
# TLS-набор, каким ходит почта. `tls.rs` общий у них с 0.3 — раньше он жил
# внутри `chatmail`, и ступень реле тянула бы за собой почтовый признак.
#
# **Без `onion-arti` ступень не работает и честно отказывает.** Это не сбой
# сборки, а следствие правила: на реле мы ходим только через Tor, потому что
# долговечный ключ nostr, связанный с адресом устройства хоть раз, связан
# с ним навсегда.
nostr = [
    "dep:tokio-tungstenite",
    # Разбор ответа реле. Сборку делает `proto`, разбор — здесь: чужой JSON
    # по догадке уже стоил нам одного урока на составе пиров меша.
    "dep:serde_json",
    # `StreamExt`/`SinkExt` для веб-сокета: он futures-поток, а не tokio-поток.
    "dep:futures",
    "dep:rustls",
    "dep:tokio-rustls",
    "dep:webpki-roots",
]
# Встроенный узел меша (0.2). **Не в `default`**, и по двум причинам сразу.
#
# Первая — та же, что у `onion-arti` и `chatmail-net`: зависимость идёт
# из git, а не с crates.io, и сборка остального дерева не должна зависеть
# от доступности чужого репозитория.
#
# Вторая своя: узел тянет ironwood, yggdrasil и tokio целиком. Тот, кому
# меша не надо — а по умолчанию он выключен (§14), — не должен платить
# за него ни временем сборки, ни размером бинарника.
#
# Без признака режим «свой узел» не исчезает из настроек: он остаётся
# и отвечает отказом «встроенный узел меша в эту сборку не включён».
# Спрятать его значило бы оставить человека гадать, куда он делся.
ygg-node = ["dep:ygg_stream", "dep:serde_json"]

[lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"
