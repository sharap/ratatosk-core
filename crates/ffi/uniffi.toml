# Настройки генератора биндингов (§13.3).
#
# Без этого файла UniFFI выводит имя пакета из имени крейта и кладёт
# биндинги в `uniffi.ratatosk_ffi`. Имя пакета — это то, что видит клиентский
# код в каждом импорте, и менять его потом дороже, чем назвать сразу.

[bindings.kotlin]
package_name = "org.ratatosk.core"

# Имя загружаемой библиотеки без префикса `lib` и расширения. Должно
# совпадать с `[lib] name` в Cargo.toml: под этим именем биндинги ищут
# библиотеку, и расхождение проявится не при сборке, а при первом запуске —
# `UnsatisfiedLinkError` без объяснений.
#
# На десктопе искать её будет JNA, а не загрузчик Android, и ищет она по
# своим правилам — каталог ресурсов вида `linux-x86-64`. Подробности
# и способ свериться — в DESKTOP.md.
cdylib_name = "ratatosk_ffi"

# Записи наружу — неизменяемые. Запись, которую клиент может поправить
# у себя, выглядит как способ что-то изменить, а изменить она может только
# копию: источник истины — телефон (§13.3), и правки туда едут командами.
#
# Отдельная запись здесь на случай, если умолчание генератора однажды
# поменяется, — поведение границы не должно зависеть от версии инструмента.
generate_immutable_records = true

[bindings.swift]
module_name = "RatatoskCore"
cdylib_name = "ratatosk_ffi"
