# cargo-deny: криптостек должен оставаться маленьким и просматриваемым (§8.1).

[advisories]
yanked = "deny"

# Исключения — поимённо и с причиной, как у метёлок: списком «не ругаться
# на заброшенное» это правило выключается целиком и молча.
ignore = [
    # `paste` объявлен заброшенным. Это не уязвимость, а предупреждение
    # о сопровождении, и крейт не наш: его тянет arti через `pwd-grp`
    # и `tor-config`. Безопасного обновления нет — сказано в самом
    # извещении. Снимать строку, когда arti слезет с `paste`; до тех пор
    # она означает «знаем и ждём», а не «считаем неважным».
    "RUSTSEC-2024-0436",

    # Marvin Attack: `rsa` не постоянна по времени, и по задержке можно
    # восстановить закрытый ключ. Патча нет и не обещано — извещение
    # прямо говорит «No safe upgrade is available», а `patched = []`
    # поставлено нарочно.
    #
    # Почему это не закрывает дерево. Крейт приезжает транзитивно —
    # `ssh-key-fork-arti` → `tor-key-forge` → arti, то есть в хранилище
    # ключей, а не в наш протокол: §8.1 RSA не знает вовсе. Атака
    # требует **операции закрытым ключом с наблюдаемой задержкой**,
    # а закрытого ключа RSA у клиента нет.
    #
    # Это рассуждение, а не аудит: что именно arti делает этим крейтом,
    # мы не проверяли. Снимать строку, когда RustCrypto закроет
    # RustCrypto/RSA#626, либо когда arti слезет с `rsa`.
    "RUSTSEC-2023-0071",

    # `basic-toml` объявлен заброшенным. Тоже предупреждение о
    # сопровождении, а не уязвимость, и приезжает он **в сборочный
    # инструмент**, а не в приложение: uniffi-bindgen → askama →
    # askama_derive читает им настройки шаблонов во время кодогенерации.
    # В .so не попадает ничего. Свежая askama 0.16.1 всё ещё на нём.
    # Снимать строку, когда askama слезет с `basic-toml`.
    "RUSTSEC-2026-0374",

    # Постоянство по времени в `crypto-bigint`: часть операций, которые
    # должны быть постоянными, у некоторых компиляторов и процессоров
    # ветвится на секретных данных.
    #
    # Это **наш** криптостек, а не чужой, и молчать об этом нельзя:
    # k256 подписывает события nostr (0.3) ключом человека.
    #
    # Что именно достижимо. Извещение называет вычитание, счёт нулей,
    # деление, умножение Монтгомери, равенство `UintRef` и
    # `BoxedMontyForm::invert`. k256 0.13 держит `U256` как хранилище
    # разрядов со своей арифметикой: оттуда зовутся `wrapping_add/sub`,
    # `conditional_select`, `sbb`, по разу `sub_mod` и `add_mod`.
    # Деления, формы Монтгомери и боксированного обращения в этом пути
    # нет вовсе; вычитание и проверки на ноль — есть. Это чтение кода,
    # а не аудит.
    #
    # Почему не обновиться. Исправление живёт только в ветке 0.7, а она
    # приезжает с `elliptic-curve 0.14`, то есть с k256 0.14 — и тянет
    # **второе поколение `digest`** рядом с нашим 0.10, ровно то, от чего
    # отказано в Cargo.toml поимённо. Обмен одного риска на другой
    # делается решением человека, а не правкой лок-файла.
    #
    # Снимать строку вместе с переходом на k256 0.14 — либо если
    # RustCrypto выпустит исправление в ветку 0.5, чего не обещано.
    "RUSTSEC-2026-0387",
]

[bans]
# Дубли версий здесь — норма, а не сигнал: arti тянет собственное поколение
# dalek, и одновременное присутствие двух версий неизбежно, пока crates/crypto
# не переведён на dalek 3. Отчёт читать глазами, сборку не ломать.
multiple-versions = "warn"

# Важное различие, из-за которого первая редакция этого файла была неверной:
# в системе ДВА уровня шифрования, и запрещать надо только смешение внутри
# одного из них.
#
#   1. Протокол Ratatosk — Noise поверх наших же кадров. Здесь §8.1 действует
#      буквально: собственных реализаций примитивов нет, альтернативных
#      реализаций тех же примитивов — тоже.
#   2. Канальный TLS внутри Tor — то, чем arti разговаривает со сторожевыми
#      узлами. Это не наш протокол, отказаться от него нельзя, и rustls
#      вместе с его бэкендом (ring или aws-lc-rs) здесь ожидаем.
#
# Поэтому rustls и ring НЕ запрещены — запрещён OpenSSL: он означал бы, что
# где-то включился native-tls вместо выбранного rustls, а это возвращает
# многодневную возню с кросс-компиляцией под Android (§13.1).
#
# Лицензия ring когда-то была `ISC AND MIT AND OpenSSL`, и список
# разрешённых нёс из-за этого строку `OpenSSL`. С 0.17.14 она
# `Apache-2.0 AND ISC`, строка стала мёртвой и убрана — держать
# разрешение, которое ничего не разрешает, значит завтра объяснять,
# откуда в дереве OpenSSL.
deny = [
    { name = "openssl" },
    { name = "openssl-sys" },
    { name = "native-tls" },
    # Сломанные хэши: в дереве мессенджера им места нет ни на одном уровне.
    { name = "md5" },
    { name = "sha-1" },
]

[licenses]
# Собственные крейты — AGPL-3.0-only, и в список разрешённых они попадают
# через `private`, а не строкой в `allow`: разреши мы AGPL целиком —
# зависимость под AGPL проехала бы молча, а её лицензия распространилась
# бы на всё дерево.
private = { ignore = true }

allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "MPL-2.0",
    "Unicode-3.0",
    "CC0-1.0",
    "Zlib",
    # Обе приехали транзитивно и обе разрешительные: `Unlicense`
    # у `async_executors` (через arti), `BSL-1.0` у `xxhash-rust`.
    # Со связью AGPL не спорят — в отличие от того, что сюда попасть
    # не должно: копилефт в зависимости связал бы дерево чужим условием.
    "Unlicense",
    "BSL-1.0",
    # `webpki-roots` — набор корневых сертификатов Mozilla, и лицензия
    # здесь накрывает **данные**, а не код: CDLA-Permissive-2.0 придумана
    # ровно для наборов данных. Список нужен rustls внутри Tor и почты;
    # своего списка корней мы не держим и держать не хотим.
    "CDLA-Permissive-2.0",
]

# Две ступени 0.2 живут не в реестре: реализации Yggdrasil на Rust
# в crates.io нет. Источники названы поимённо, а не разрешены списком
# «любой git»: подменённый адрес иначе проехал бы молча.
[sources]
allow-git = [
    "https://github.com/Revertron/Yggdrasil-ng",
    "https://github.com/Revertron/ygg_stream",
]
