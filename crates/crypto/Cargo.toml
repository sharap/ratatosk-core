[package]
name = "ratatosk-crypto"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Криптостек Ratatosk v0.1: идентичность, Noise IK, ретчет, AEAD (§3, §8)"

# §8.1: «Собственных реализаций примитивов нет. Собственный код — только их
# комбинирование, в одном модуле, покрытом тест-векторами.» Этот крейт и есть
# тот самый модуль. Любая новая зависимость сюда — повод для ревью, а не
# рутинная правка.
[dependencies]
ratatosk-wire.workspace = true

blake3.workspace = true
sha2.workspace = true
sha3.workspace = true
x25519-dalek.workspace = true
ed25519-dalek.workspace = true
chacha20poly1305.workspace = true
argon2.workspace = true
zeroize.workspace = true
subtle.workspace = true
snow.workspace = true
rand_core.workspace = true
data-encoding.workspace = true
thiserror.workspace = true

[dev-dependencies]
hex.workspace = true
# Инварианты §16: «decrypt(encrypt(x)) == x при любых перестановках»
# и «ключ сообщения не выдаётся дважды».
proptest.workspace = true

[lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"
